<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<title>Nueva pestaña - Facuedu.uy</title>
<style>
  :root {
    --bg: #ffffff;
    --text: #202124;
    --input-bg: #ffffff;
    --input-border: #dcdcdc;
  }
  body.dark {
    --bg: #17181a;
    --text: #f1f1f1;
    --input-bg: #26272b;
    --input-border: #3a3b40;
  }
  @media (prefers-color-scheme: dark) {
    body.auto {
      --bg: #17181a;
      --text: #f1f1f1;
      --input-bg: #26272b;
      --input-border: #3a3b40;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: "Segoe UI", Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  .logo { width: 96px; height: 96px; margin-bottom: 18px; }
  h1 { font-size: 20px; margin: 0 0 26px 0; font-weight: 600; }
  form {
    display: flex;
    align-items: center;
    width: 90%;
    max-width: 560px;
    background: var(--input-bg);
    border: 1px solid var(--input-border);
    border-radius: 24px;
    padding: 4px 6px 4px 18px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
  }
  input {
    flex: 1;
    border: none;
    outline: none;
    background: transparent;
    color: var(--text);
    font-size: 15px;
    padding: 10px 0;
  }
  button {
    background: linear-gradient(135deg, #6320ee, #ff2d95);
    color: white;
    border: none;
    border-radius: 20px;
    padding: 10px 20px;
    font-size: 13px;
    cursor: pointer;
  }
  .motor { font-size: 12px; opacity: 0.65; margin-top: 14px; }
</style>
</head>
<body>
  <img class="logo" src="../assets/logo.png" alt="Facuedu.uy" />
  <h1>Facuedu.uy AYUDA Navegadore</h1>
  <form id="search-form">
    <input id="search-input" type="text" placeholder="Buscar" autofocus />
    <button type="submit">Buscar</button>
  </form>
  <p class="motor" id="motor"></p>

  <script>
    // El tema, el nombre del buscador y su dirección llegan por la URL (las arma main.js).
    const params = new URLSearchParams(window.location.search);
    const theme = params.get('theme');
    if (theme === 'dark') {
      document.body.classList.add('dark');
    } else if (theme === 'auto') {
      document.body.classList.add('auto');
      if (window.matchMedia('(prefers-color-scheme: dark)').matches) document.body.classList.add('dark');
    }

    const engineName = params.get('engine') || 'Google';
    const searchBase = params.get('search') || 'https://www.google.com/search?q=';
    document.getElementById('search-input').placeholder = 'Buscar en ' + engineName;
    document.getElementById('motor').textContent = 'Buscador: ' + engineName;

    document.getElementById('search-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const q = document.getElementById('search-input').value.trim();
      if (q) window.location.href = searchBase + encodeURIComponent(q);
    });
  </script>
</body>
</html>
