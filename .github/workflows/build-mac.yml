name: Build macOS

on:
  workflow_dispatch:

jobs:
  mac:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias
        run: npm install

      - name: Compilar macOS arm64 y x64 (sin firma)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run build:mac

      - name: Subir archivos generados
        uses: actions/upload-artifact@v4
        with:
          name: facuedu-navegadore-mac
          path: |
            dist/*.dmg
            dist/*.zip
